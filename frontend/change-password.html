<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambiar contrasena | MiConsultorio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="change-password">
    <main class="shell login-shell">
      <section class="card login-card">
        <div>
          <p class="eyebrow">Primer ingreso</p>
          <h1>Crea tu contrasena</h1>
          <p class="lead muted">Tu cuenta fue creada con una contrasena temporal. Por seguridad, defini una contrasena personal antes de continuar.</p>
        </div>

        <form id="changePasswordForm" class="booking-form">
          <label>
            Contrasena temporal
            <input id="currentPassword" type="password" required placeholder="La que te paso el administrador" autocomplete="current-password" />
          </label>
          <label>
            Nueva contrasena
            <input id="newPassword" type="password" required placeholder="Minimo 8 caracteres" autocomplete="new-password" />
          </label>
          <label>
            Confirmar nueva contrasena
            <input id="confirmPassword" type="password" required placeholder="Repeti la nueva contrasena" autocomplete="new-password" />
          </label>

          <button class="button primary" type="submit">Guardar y continuar</button>
        </form>

        <div id="changePasswordMessage" class="feedback-box hidden"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
